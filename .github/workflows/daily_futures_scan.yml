name: Daily Futures Strategy Scan

on:
  schedule:
    # Run 1: 03:30 UTC Tue-Sat (10:30 PM EST / 11:30 PM EDT Mon-Fri) - Asia Session Overnight Globex Taylor & 1H Divergence scan
    - cron: '30 3 * * 2-6'
    # Run 2: 08:15 UTC Mon-Fri (3:15 AM EST / 4:15 AM EDT) - London / Europe Open Overnight Globex Taylor & 1H Divergence scan
    - cron: '15 8 * * 1-5'
    # Run 3: 14:00 UTC (10:00 AM ET / 7:00 AM PT) - Morning RTH open & early breakout scan
    - cron: '0 14 * * 1-5'
    # Run 4: 17:30 UTC (1:30 PM ET / 10:30 AM PT) - Mid-session intraday breakout & MTM update
    - cron: '30 17 * * 1-5'
    # Run 5: 20:05 UTC (4:05 PM EDT / 1:05 PM PDT) - Immediate US RTH Pit Close scan (EDT)
    - cron: '5 20 * * 1-5'
    # Run 6: 21:15 UTC (5:15 PM EDT / 4:15 PM EST) - CME Globex Close & EST RTH Close scan
    - cron: '15 21 * * 1-5'
    # Run 7: 00:30 UTC Tue-Sat (8:30 PM ET Mon-Fri) - Finalized CME settlement bars & early Globex open
    - cron: '30 0 * * 2-6'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scan_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Futures Strategy Scanner Suite
        run: |
          python scripts/daily_futures_scan.py

      - name: Update IRA Portfolio Prices
        continue-on-error: true
        run: |
          python scripts/update_ira_portfolio.py

      - name: Commit and Push Updated Signals
        run: |
          git config --global user.name "OzCTA Automation"
          git config --global user.email "bot@ozcta.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "No signal changes today — skipping commit."
          else
            git commit -m "Auto-update daily futures signals and executed trades"
            git pull --rebase -X theirs origin main
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi
