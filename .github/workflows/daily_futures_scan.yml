name: Daily Futures Strategy Scan

on:
  schedule:
    # Run 1: 21:30 UTC (5:30 PM ET / 2:30 PM PT) - initial post-close scan
    - cron: '30 21 * * 1-5'
    # Run 2: 00:30 UTC Tue-Sat (8:30 PM ET Mon-Fri) - catches finalized settlement bars from Yahoo Finance
    - cron: '30 0 * * 2-6'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scan_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Futures Strategy Scanner Suite
        run: |
          python scripts/daily_futures_scan.py

      - name: Commit and Push Updated Signals
        run: |
          git config --global user.name "OzCTA Automation"
          git config --global user.email "bot@ozcta.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "No signal changes today — skipping commit."
          else
            git commit -m "Auto-update daily futures signals [skip ci]"
            git pull --rebase origin main
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi

